# ==========================================================
#              TEMA DINÂMICO (OMARCHY SYNC)
# ==========================================================
# Carregar tema atual sincronizado com Omarchy
if-shell "test -f ~/.config/tmux/current-theme.conf" "source ~/.config/tmux/current-theme.conf"

# ==========================================================
#              CONFIGURAÇÃO DA STATUS BAR
# ==========================================================
# Configurações de layout da status bar para substituir o plugin Catppuccin

set -g status-right-length 100
set -g status-left-length 100

# Status left: vazio (apenas janelas)
set -g status-left ""

# Status right: diretório, hora e indicador de prefix com fundo colorido
set -g status-right "#[fg=#{@theme_black},bg=#{@theme_bg}]#[fg=#{@theme_white},bg=#{@theme_black}] #{b:pane_current_path} #[fg=#{@theme_blue},bg=#{@theme_black}]#[fg=#{@theme_bg},bg=#{@theme_blue},bold] %H:%M #[fg=#{@theme_magenta},bg=#{@theme_blue}]#[fg=#{@theme_bg},bg=#{@theme_magenta},bold] %d/%m #{?client_prefix,#[fg=#{@theme_bg}]#[bg=#{@theme_red}]#[bold] 󰆍 ,#[fg=#{@theme_blue}]#[bg=#{@theme_black}] 󰆍 }"

# Configuração das janelas com números (com cores, sem separadores powerline externos)
# IMPORTANTE: o #I precisa estar "limpo" para o mouse funcionar corretamente
setw -g window-status-format "#[fg=#{@theme_white},bg=#{@theme_black}] #I #W "
setw -g window-status-current-format "#[fg=#{@theme_bg},bg=#{@theme_magenta},bold] #I #W "

# Separadores e espaçamento
set -g window-status-separator ""

# Configurações gerais da status bar (estilo Catppuccin)
set -g status-justify left
set -g status-position top

# Configurações de janela mais limpas (estilo Catppuccin)
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

# ==========================================================
#              INICIALIZAÇÃO DO GERENCIADOR DE PLUGINS
# ==========================================================
# IMPORTANTE: DEVE SER A ÚLTIMA LINHA DO ARQUIVO
run ~/.tmux/plugins/tpm/tpm

# Desabilitar títulos dos painéis
set -g pane-border-status off
