# ==========================================================
#                  CONFIGURAÇÃO GERAL
# ==========================================================

# Recarregar o arquivo de configuração com a tecla 'r'
unbind r
bind r source-file ~/.tmux.conf \; display "Configuração recarregada!"
set-option -sa terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set-option -sa terminal-features ',xterm-kitty:RGB'

# Mudar o prefixo padrão de C-b para C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Habilitar o mouse
set-option -g mouse on

# Mouse já configurado pelos defaults do tmux

# Usar teclas no estilo 'vi' para copiar e navegar
set-option -g mode-keys vi

# Copy mode indicator - destaque visual quando em copy mode
set -g mode-style "fg=#cad3f5,bg=#ed8796,bold"

# Iniciar a contagem de janelas e painéis a partir de 1
set-option -g base-index 1
setw -g pane-base-index 1

# Posicionar a barra de status no topo
set-option -g status-position top

# Renomear janelas automaticamente (configurado abaixo na seção de status bar)
# set-option -g automatic-rename on
set-option -g allow-rename off # Impede que o programa mude o nome sozinho

# Estilo dos painéis
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'



# Suporte para 256 cores
set -g default-terminal "tmux-256color"


# ==========================================================
#                   ATALHOS DE TECLADO
# ==========================================================

# Navegar entre os painéis com h, j, k, l (estilo vim)
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# Remover bindings que podem conflitar com vim-tmux-navigator
# unbind-key -T prefix h
# unbind-key -T prefix j
# unbind-key -T prefix k
# unbind-key -T prefix l




# ==========================================================
#                  LISTA DE PLUGINS (TPM)
# ==========================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catppuccin/tmux'  # Desabilitado em favor do tema dinâmico do Omarchy
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-cpu'


