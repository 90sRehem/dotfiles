# ==========================================================
#                  CONFIGURAÇÃO GERAL
# ==========================================================

# Recarregar o arquivo de configuração com a tecla 'r'
unbind r
bind r source-file ~/.tmux.conf \; display "Configuração recarregada!"
set-option -sa terminal-overrides ',xterm*:Tc'

# Mudar o prefixo padrão de C-b para C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Habilitar o mouse
set-option -g mouse on

# Usar teclas no estilo 'vi' para copiar e navegar
set-option -g mode-keys vi

# Copy mode indicator - destaque visual quando em copy mode
set -g mode-style "fg=#cad3f5,bg=#ed8796,bold"

# Iniciar a contagem de janelas e painéis a partir de 1
set-option -g base-index 1
setw -g pane-base-index 1

# Posicionar a barra de status no topo
set-option -g status-position top

# Renomear janelas automaticamente com base no processo em execução (nvim, zsh, etc)
set-option -g automatic-rename on
set-option -g allow-rename off # Impede que o programa mude o nome sozinho

# Estilo dos painéis
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'



# Suporte para 256 cores
set -g default-terminal "tmux-256color"


# ==========================================================
#                   ATALHOS DE TECLADO
# ==========================================================

# Navegar entre os painéis com h, j, k, l (estilo vim)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R




# ==========================================================
#                  LISTA DE PLUGINS (TPM)
# ==========================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-cpu'


# ==========================================================
#            CONFIGURAÇÃO DO TEMA (CATPPUCCIN)
# ==========================================================

set -g @catppuccin_flavor 'macchiato' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_status_modules_left "windows"

# Configurar módulo customizado para repositório
set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_directory_icon " "
set -g @catppuccin_directory_color "blue"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_windows}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# run ~/.tmux/plugins/tmux/catppuccin.tmux

# run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux


# ==========================================================
#              TEMA DINÂMICO (OMARCHY SYNC)
# ==========================================================
# Carregar tema atual sincronizado com Omarchy
if-shell "test -f ~/.config/tmux/current-theme.conf" "source ~/.config/tmux/current-theme.conf"

# ==========================================================
#              INICIALIZAÇÃO DO GERENCIADOR DE PLUGINS
# ==========================================================
# IMPORTANTE: DEVE SER A ÚLTIMA LINHA DO ARQUIVO
run ~/.tmux/plugins/tpm/tpm

# Desabilitar títulos dos painéis
set -g pane-border-status off
