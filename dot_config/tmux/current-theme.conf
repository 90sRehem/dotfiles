# Auto-gerado a partir do tema Omarchy: Rose Pine
# ter 16 set 2025 18:34:16 -03

# Cores do tema Rose Pine
set -g @theme_bg '#faf4ed'
set -g @theme_fg '#575279'
set -g @theme_black '#f2e9e1'
set -g @theme_red '#b4637a'
set -g @theme_green '#286983'
set -g @theme_yellow '#ea9d34'
set -g @theme_blue '#56949f'
set -g @theme_magenta '#907aa9'
set -g @theme_cyan '#d7827e'
set -g @theme_white '#575279'

# Aplicar cores aos elementos do tmux
set -g status-style "bg=#faf4ed,fg=#575279"
set -g status-left-style "bg=#56949f,fg=#faf4ed,bold"
set -g status-right-style "bg=#faf4ed,fg=#575279"

# Janela ativa
set -g window-status-current-style "bg=#907aa9,fg=#faf4ed,bold"

# Janela inativa  
set -g window-status-style "bg=#f2e9e1,fg=#575279"

# Bordas dos painéis
set -g pane-active-border-style "fg=#907aa9,bg=default"
set -g pane-border-style "fg=#f2e9e1,bg=default"

# Copy mode
set -g mode-style "fg=#faf4ed,bg=#ea9d34,bold"

# Mensagens
set -g message-style "bg=#ea9d34,fg=#faf4ed,bold"
set -g message-command-style "bg=#b4637a,fg=#faf4ed,bold"
