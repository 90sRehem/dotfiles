# Auto-gerado a partir do tema Omarchy: osaka-jade
# Mon Dec  8 03:22:25 PM -03 2025

# Cores do tema osaka-jade
set -g @theme_bg '#111C18'
set -g @theme_fg '#C1C497'
set -g @theme_black '#53685B'
set -g @theme_red '#FF5345'
set -g @theme_green '#549E6A'
set -g @theme_yellow '#459451'
set -g @theme_blue '#509475'
set -g @theme_magenta '#D2689C'
set -g @theme_cyan '#2DD5B7'
set -g @theme_white '#F6F5DD'

# Status bar geral
set -g status-style "bg=#111C18,fg=#C1C497"
set -g status-left-style "bg=#509475,fg=#111C18,bold"
set -g status-right-style "bg=#111C18,fg=#C1C497"

# Configuração das janelas
set -g window-status-current-style "bg=#D2689C,fg=#111C18,bold"
set -g window-status-style "bg=#53685B,fg=#F6F5DD"
set -g window-status-activity-style "bg=#459451,fg=#111C18"
set -g window-status-bell-style "bg=#FF5345,fg=#111C18"

# Bordas dos painéis
set -g pane-active-border-style "fg=#509475,bg=default"
set -g pane-border-style "fg=#53685B,bg=default"

# Configuração de copy mode  
set -g mode-style "fg=#111C18,bg=#459451,bold"

# Mensagens e comandos
set -g message-style "bg=#549E6A,fg=#111C18,bold"
set -g message-command-style "bg=#2DD5B7,fg=#111C18,bold"

# Indicadores de atividade
set -g window-status-activity-style "underscore"
set -g monitor-activity on
set -g visual-activity off

# Garantir que o mouse permaneça habilitado após aplicar tema
set -g mouse on

