# Auto-gerado a partir do tema Omarchy: Catppuccin
# ter 16 set 2025 18:41:20 -03

# Cores do tema Catppuccin
set -g @theme_bg '#24273a'
set -g @theme_fg '#cad3f5'
set -g @theme_black '#494d64'
set -g @theme_red '#ed8796'
set -g @theme_green '#a6da95'
set -g @theme_yellow '#eed49f'
set -g @theme_blue '#8aadf4'
set -g @theme_magenta '#f5bde6'
set -g @theme_cyan '#8bd5ca'
set -g @theme_white '#b8c0e0'

# Status bar geral
set -g status-style "bg=#24273a,fg=#cad3f5"
set -g status-left-style "bg=#8aadf4,fg=#24273a,bold"
set -g status-right-style "bg=#24273a,fg=#cad3f5"

# Configuração das janelas
set -g window-status-current-style "bg=#f5bde6,fg=#24273a,bold"
set -g window-status-style "bg=#494d64,fg=#b8c0e0"
set -g window-status-activity-style "bg=#eed49f,fg=#24273a"
set -g window-status-bell-style "bg=#ed8796,fg=#24273a"

# Bordas dos painéis - cores mais suaves
set -g pane-active-border-style "fg=#8aadf4,bg=default"
set -g pane-border-style "fg=#494d64,bg=default"

# Configuração de copy mode  
set -g mode-style "fg=#24273a,bg=#eed49f,bold"

# Mensagens e comandos
set -g message-style "bg=#a6da95,fg=#24273a,bold"
set -g message-command-style "bg=#8bd5ca,fg=#24273a,bold"

# Indicadores de atividade
set -g window-status-activity-style "underscore"
set -g monitor-activity on
set -g visual-activity off
