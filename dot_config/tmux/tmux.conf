# ============================================================================
# TMUX CONFIGURATION - organized by concern
# Sections: options > prefix & keys > appearance > plugins (TPM) >
#           persistence > theme > integrations
# ============================================================================

# ----------------------------------------------------------------------------
# 1. GENERAL OPTIONS
# ----------------------------------------------------------------------------
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -s escape-time 1
set -g mouse on

# start windows and panes at 1, renumber on close
set-option -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# extended keys for Shift+Enter, Shift+Tab, etc.
# needed by apps like OpenCode to distinguish Shift+Enter from Enter
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -sa terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set-option -sa terminal-features 'xterm-kitty:RGB'
set-option -sa terminal-features 'tmux-256color:extkeys'
set-option -sa terminal-features 'xterm-kitty:extkeys'

# reload config with prefix + r
unbind -T root r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuração recarregada!"

# ----------------------------------------------------------------------------
# 2. PREFIX & KEYBINDINGS
# ----------------------------------------------------------------------------
# prefix: C-b -> C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# splits
bind | split-window -h
bind - split-window -v

# Shift+Enter -> Ctrl+J (newline in OpenCode and TUIs that accept C-j)
bind-key -n S-Enter send-keys C-j

# clear stale sq-sidebar bindings from a previous server session before rebinding
unbind -n C-M-s
unbind -n C-M-n
unbind -n C-M-a
unbind -n C-M-f
unbind -n MouseDown1Pane
bind-key -n MouseDown1Pane select-pane -t= \; send-keys -M

# ----------------------------------------------------------------------------
# 3. APPEARANCE
# ----------------------------------------------------------------------------
set -g status-position bottom

# active pane highlight: heavy colored border + dimmed inactive panes
set -g pane-border-lines heavy
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39,bold'
set -g window-style 'fg=colour245,bg=colour234'
set -g window-active-style 'fg=colour255,bg=default'

# ----------------------------------------------------------------------------
# 4. PLUGINS (managed by TPM - prefix + I to install)
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexanderjeurissen/tmux-powerkit'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-agents-mon removed 2026-08-17; replaced by sq-sidebar (squad/tmux/sq-sidebar.tmux)

set -g @powerkit_status_position 'bottom'
# PowerKit plugins: datetime,battery,cpu,memory,hostname,git (agentsmon removed 2026-08-17)
set -g @powerkit_plugins "datetime,battery,cpu,memory,hostname,git"

# ----------------------------------------------------------------------------
# 5. PERSISTENCE (2026-08-15): tmux-resurrect only (continuum removed 2026-08-17)
# Save: prefix + C-s. Restore: prefix + C-R (C-r is taken by powerkit theme selector).
# ----------------------------------------------------------------------------
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-R'

# ----------------------------------------------------------------------------
# 6. THEME (powerkit, synced with Omarchy theme)
# ----------------------------------------------------------------------------
source-file ~/.config/tmux/powerkit-theme.conf
if-shell -b '[ -f ~/.config/tmux/plugins/tmux-powerkit/tmux-powerkit.tmux ]' \
  'run-shell ~/.config/tmux/plugins/tmux-powerkit/tmux-powerkit.tmux'

# ----------------------------------------------------------------------------
# 7. INTEGRATIONS
# ----------------------------------------------------------------------------
# Squad base pin for workmux sidebar auto-detection
set-environment -g SQUAD_BASE /home/rehem/Projects/squad
run-shell -b "/home/rehem/Projects/squad/tmux/workmux-sidebar.tmux"

# OSC 52 clipboard forwarding for remote Neovim yanks
set -as terminal-features ",*:clipboard"

# TPM must stay last so plugin bindings apply after everything above
run -b '~/.config/tmux/plugins/tpm/tpm'
