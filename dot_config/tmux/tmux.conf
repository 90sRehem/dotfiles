# ==========================================================
#                  CONFIGURAÇÃO GERAL
# ==========================================================

# Recarregar o arquivo de configuração com a tecla 'r'
unbind -T root r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuração recarregada!"
set-option -sa terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set-option -sa terminal-features ',xterm-kitty:RGB'
set -g extended-keys-format csi-u
# Habilitar extended keys para Shift+Enter, Shift+Tab, etc.
# Necessário para apps como OpenCode distinguirem Shift+Enter de Enter
set-option -g extended-keys on
set-option -sa terminal-features 'xterm-kitty:extkeys'

# Garantir que tmux repasse CSI extended keys para apps internos
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features 'tmux-256color:extkeys'

# Shift+Enter → Ctrl+J (newline no OpenCode e outros TUIs que aceitam Ctrl+J como input_newline)
bind-key -n S-Enter send-keys C-j

# Mudar o prefixo padrão de C-b para C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Habilitar o mouse
set-option -g mouse on

# Iniciar a contagem de janelas e painéis a partir de 1
set-option -g base-index 1
setw -g pane-base-index 1

# Reordenar painéis 123
set-option -g renumber-windows on

# Plugins Tmux
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-yank'  
set -g @plugin 'christoomey/vim-tmux-navigator'

# Omarchy Tmux integration
source-file ~/.config/omarchy/current/theme/tmux.conf
# End Omarchy Tmux integration

set -g default-shell /usr/bin/zsh
run '~/.config/tmux/plugins/tpm/tpm'

# ==========================================================
#             CUSTOMIZAÇÕES PESSOAIS
# ==========================================================
# IMPORTANTE: Estas configurações sobrescrevem o omarchy-tmux

# Aumentar o comprimento do status-left para permitir nomes de sessão longos
set -g status-left-length 50

# Configuração do prefix highlight
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#1a1b26,bg=#e0af68,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=#1a1b26,bg=#9ece6a,bold'

# Status right personalizado com powerline
# Indicador de prefix: sempre visível, muda de cor quando ativo
# Neutro: cinza (#6a6e95) | Ativo: verde (#4fe88f)
set -g status-right "\
#[fg=#{?client_prefix,#4fe88f,#6a6e95},bg=#0B0C16,nobold,noitalics,nounderscore]\
#[fg=#0B0C16,bg=#{?client_prefix,#4fe88f,#6a6e95},bold] 󰘳 \
#[fg=#6fe88f,bg=#{?client_prefix,#4fe88f,#6a6e95},nobold,noitalics,nounderscore] \
#[fg=#0B0C16,bg=#4fe88f,bold]  #{b:pane_current_path} "
