# Configurações de segurança para lockscreen
# Este arquivo previne travamentos do hyprlock

# Configurações específicas para lockscreen
windowrulev2 = nofocus, class:^(hyprlock)$
windowrulev2 = noshadow, class:^(hyprlock)$
windowrulev2 = noblur, class:^(hyprlock)$
windowrulev2 = nomaximizerequest, class:^(hyprlock)$
windowrulev2 = nofullscreenrequest, class:^(hyprlock)$
windowrulev2 = pin, class:^(hyprlock)$

# Prevenir problemas de GPU/renderização
windowrulev2 = immediate, class:^(hyprlock)$
windowrulev2 = dimaround, class:^(hyprlock)$