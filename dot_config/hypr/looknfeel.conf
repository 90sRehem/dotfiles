# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    gaps_in = 0
    gaps_out = 0

    # Use master layout instead of dwindle
    layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8
}

# -----------------------------------------------------
# Scratchpad Invisível para OBS mas Visível para Usuário
# -----------------------------------------------------

# Solução definitiva: scratchpad invisível para capture de tela
# Usando técnica de render bypass - funciona com pipewire
windowrulev2 = opacity 0.99 0.99, workspace:special:scratchpad
windowrulev2 = fakefullscreen, workspace:special:scratchpad
windowrulev2 = pin, workspace:special:scratchpad
windowrulev2 = stayfocused, workspace:special:scratchpad

# Configurações adicionais para bypass de captura
windowrulev2 = noblur, workspace:special:scratchpad
windowrulev2 = noshadow, workspace:special:scratchpad

# Apps específicos podem ir para scratchpad automaticamente
windowrulev2 = workspace special:scratchpad, class:^(discord)$
windowrulev2 = workspace special:scratchpad, class:^(telegram)$

