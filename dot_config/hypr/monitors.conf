# See https://wiki.hyprland.org/Configuring/Monitors/

# Change to 1 if on a 1x display (then change last "auto" to 1 in monitor=)
# Change to something like 1.75 for fractional scaling (can work well with 1.66667 monitor scaling)
# Note: You must relaunch Hyprland after changing any env like this (use Super+Esc, then Relaunch)
env = GDK_SCALE,2

# Monitor Setup: Vertical Layout with secondary monitor below primary
# Primary monitor: LG ULTRAWIDE at top (Workspaces 1-5)
monitor = DP-3, 3440x1440@159.96, 0x0, 1

# Secondary monitor: HDMI centered below primary (Workspaces 6-10)
# X position: 760 = (3440-1920)/2 for centering
monitor = HDMI-A-1, 1920x1080@59.96, 760x1440, 1

# Fallback for other monitors
monitor = , preferred, auto, auto

# Example for fractional scaling that works well with GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60.00, auto, 2
# monitor = eDP-1, 2880x1920@120.00, auto, 2
